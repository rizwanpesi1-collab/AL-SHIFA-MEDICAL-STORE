<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائیو کرکٹ اسکور بورڈ</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        .scoreboard-container {
            width: 900px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* اوپر والی پٹی: ٹیمیں اور اسکور */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team-name {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .overs {
            font-size: 14px;
            color: #94a3b8;
        }

        .match-status {
            font-size: 14px;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        /* درمیانی پٹی: رن ریٹ اور ہدف */
        .sub-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.5);
            padding: 8px 20px;
            font-size: 13px;
            color: #cbd5e1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* کھلاڑیوں اور بولر کا سیکشن */
        .players-section {
            display: grid;
            grid-template-columns: 2fr 2fr 2fr;
            gap: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        .player-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .player-name {
            font-weight: bold;
            font-size: 15px;
            color: #f8fafc;
        }

        .player-stats {
            font-size: 14px;
            color: #38bdf8;
            margin-top: 4px;
        }

        .player-details-small {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* نیچے والا سیکشن: اوور ٹریکر (بال بائی بال) */
        .over-tracker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #0b0f19;
        }

        .tracker-title {
            font-size: 12px;
            color: #94a3b8;
            font-weight: bold;
        }

        .balls-container {
            display: flex;
            gap: 8px;
        }

        .ball {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            background: #334155;
            color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .ball.four {
            background: #0284c7;
        }

        .ball.six {
            background: #16a34a;
        }

        .ball.wicket {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="scoreboard-container">
        <!-- اوپر والی پٹی -->
        <div class="top-bar">
            <div class="team-info">
                <span class="team-name">پاکستان</span>
                <span class="score">185/4</span>
                <span class="overs">(41.3 اوورز)</span>
            </div>
            <div class="match-status">CRR: 4.45 | ہدف: 268</div>
        </div>

        <!-- ذیلی معلومات -->
        <div class="sub-bar">
            <span>پارٹنرشپ: 56 رنز (78 بالز)</span>
            <span>درکار: 83 رنز (111 بالز)</span>
        </div>

        <!-- بیٹسمین اور بولر کی تفصیل -->
        <div class="players-section">
            <!-- بیٹسمین 1 -->
            <div class="player-card" style="border-left: 3px solid #38bdf8;">
                <div class="player-header">
                    <span>بیٹسمین</span>
                    <span>اسٹرائیک ریٹ</span>
                </div>
                <div class="player-name">محمد رضوان *</div>
                <div class="player-stats">74 <span style="font-size: 11px; color: #94a3b8;">(103)</span></div>
                <div class="player-details-small">6 چوکے، 2 چھکے (SR: 71.8)</div>
            </div>

            <!-- بیٹسمین 2 -->
            <div class="player-card">
                <div class="player-header">
                    <span>بیٹسمین</span>
                    <span>اسٹرائیک ریٹ</span>
                </div>
                <div class="player-name">بابراعظم</div>
                <div class="player-stats">48 <span style="font-size: 11px; color: #94a3b8;">(67)</span></div>
                <div class="player-details-small">4 چوکے (SR: 71.6)</div>
            </div>

            <!-- بولر -->
            <div class="player-card" style="border-right: 3px solid #fbbf24;">
                <div class="player-header">
                    <span>بولر</span>
                    <span>اوورز</span>
                </div>
                <div class="player-name">پیٹ کمنز</div>
                <div class="player-stats">2-42 <span style="font-size: 11px; color: #94a3b8;">(8.3)</span></div>
                <div class="player-details-small">اکانومی: 4.94</div>
            </div>
        </div>

        <!-- اوور ٹریکر -->
        <div class="over-tracker">
            <span class="tracker-title">حالیہ اوور:</span>
            <div class="balls-container">
                <div class="ball">0</div>
                <div class="ball four">4</div>
                <div class="ball">1</div>
                <div class="ball wicket">W</div>
                <div class="ball">0</div>
                <div class="ball six">6</div>
            </div>
        </div>
    </div>

</body>
</html>
