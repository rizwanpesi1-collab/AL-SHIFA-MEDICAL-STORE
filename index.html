<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PAK LIVE OVERLAY - SERIES + SCORE</title>
<style>
body{margin:0;font-family:Arial Black;background:#0a1929;color:#fff}
#selector{padding:20px;max-width:650px;margin:auto}
h2{text-align:center;color:#ffeb3b}
.match{background:#fff;color:#000;border-radius:12px;padding:14px;margin:12px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.match:hover{background:#ffeb3b;transform:scale(1.02)}
.match b{font-size:16px} .match span{font-size:11px;background:#0d47a1;color:#fff;padding:5px 10px;border-radius:20px}
#overlayMode{display:none;width:1920px;height:1080px;position:relative}
.series{position:absolute;top:520px;left:50%;transform:translateX(-50%);width:1100px;background:#000;color:#ffeb3b;text-align:center;padding:6px;font-size:15px;font-weight:900;border-radius:10px 10px 0 0;border:3px solid #fff;border-bottom:none}
.wrap{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:1100px}
.top{display:flex;height:78px;border:3px solid #fff;border-radius:0 0 14px 14px;overflow:hidden}
.left{flex:1.4;background:linear-gradient(90deg,#1565c0,#1e88e5);display:flex;align-items:center;padding:0 15px;color:#fff}
.right{flex:1.4;background:linear-gradient(90deg,#2e7d32,#43a047);display:flex;align-items:center;justify-content:flex-end;padding:0 15px;color:#fff}
.mid{width:220px;background:#0a0a0a;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-left:4px solid #fff;border-right:4px solid #fff}
.team-name{font-size:18px;font-weight:900}
.big-score{font-size:42px;font-weight:900}
.over-badge{background:#ffeb3b;color:#000;font-size:20px;padding:2px 7px;border-radius:6px;margin-left:8px;font-weight:900}
.flag{width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:#fff;object-fit:cover}
.mid-flag{width:48px;height:48px;border-radius:50%;border:2px solid #fff}
.circle{width:56px;height:56px;background:radial-gradient(circle,#ffeb3b,#ff9800);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#000;border:3px solid #fff}
.bar2{display:flex;height:32px;font-weight:900;font-size:14px;margin-top:5px}
.crr{flex:1;background:#0d47a1;color:#fff;display:flex;align-items:center;padding-left:14px;border-radius:0 0 0 10px}
.need{flex:1;background:#ffeb3b;color:#000;display:flex;align-items:center;justify-content:center;border-radius:0 0 10px 0}
.bar3{display:flex;gap:5px;margin-top:5px;height:28px;font-weight:900;font-size:13px}
.pship{background:#e91e8c;color:#fff;padding:0 14px;border-radius:8px;display:flex;align-items:center}
.probs{flex:1;display:flex;gap:5px}.probs div{flex:1;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.pakp{background:#212121} .slp{background:#1565c0}
.players{display:flex;gap:5px;margin-top:5px;height:102px}
.card{flex:1;background:#fff;border-radius:10px;border:3px solid #fff;overflow:hidden;display:flex}
.card-body{flex:1;padding:3px 8px;display:flex;flex-direction:column}
.badge{font-size:11px;background:#0d47a1;color:#fff;padding:2px 10px;border-radius:20px;align-self:flex-start}
.pname{font-size:13px;font-weight:900;color:#0d47a1;text-align:center;margin-top:4px}
.pscore{font-size:28px;font-weight:900;text-align:center}
.stats{background:#ffeb3b;font-size:10px;font-weight:900;display:flex;justify-content:space-around;padding:3px 0;margin-top:auto;border-radius:4px;color:#000}
.recent{display:flex;height:32px;background:#0f1419;border:3px solid #fff;border-radius:10px;margin-top:5px;align-items:center;padding:0 12px;gap:6px}
.rlabel{color:#00ff88;font-weight:900}
.b{width:26px;height:26px;border-radius:50%;background:#fff;color:#000;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:12px}
</style>
</head>
<body>
<div id="selector">
<h2>🏏 LIVE SERIES + SCORE</h2>
<div id="list">Cricbuzz سے Live Matches لوڈ ہو رہے ہیں...</div>
</div>
<div id="overlayMode">
<div class="series" id="seriesName">Loading Series...</div>
<div class="wrap">
<div class="top">
<div class="left"><div><div class="team-name" id="t1n">PAKISTAN</div><div style="display:flex;align-items:center"><span class="big-score" id="t1s">0-0</span><span class="over-badge" id="t1o">0.0</span></div></div><img class="flag" id="t1f" src="https://flagcdn.com/w80/pk.png" style="margin-left:12px"></div>
<div class="mid"><img class="mid-flag" id="mf1" src="https://flagcdn.com/w80/pk.png"><div class="circle" id="ballsLeft">0</div><img class="mid-flag" id="mf2" src="https://flagcdn.com/w80/gb-eng.png"></div>
<div class="right"><img class="flag" id="t2f" src="https://flagcdn.com/w80/gb-eng.png" style="margin-right:12px"><div style="text-align:right"><div class="team-name" id="t2n">ENGLAND</div><div class="big-score" id="t2s">0-0</div></div></div>
</div>
<div class="bar2"><div class="crr" id="crr">CRR : 0.00</div><div class="need" id="need">Fetching Live...</div></div>
<div class="bar3"><div class="pship" id="pship">P'SHIP: 0(0)</div><div class="probs"><div class="pakp" id="prob1">LIVE</div><div class="slp" id="prob2">AUTO</div></div></div>
<div class="players">
<div class="card"><div class="card-body"><span class="badge">BATSMAN</span><div class="pname" id="b1n">Loading...</div><div class="pscore" id="b1s">0</div><div class="stats"><span>4S:0</span><span>SR:0</span></div></div></div>
<div class="card"><div class="card-body"><span class="badge">BATSMAN</span><div class="pname" id="b2n">Loading...</div><div class="pscore" id="b2s">0</div><div class="stats"><span>4S:0</span><span>SR:0</span></div></div></div>
<div class="card"><div class="card-body"><span class="badge">BOWLER</span><div class="pname" id="bwn">Loading...</div><div class="pscore" id="bws">0-0</div><div class="stats"><span>ECON:0</span></div></div></div>
</div>
<div class="recent"><span class="rlabel">RECENT</span><div style="display:flex;gap:6px" id="recent"></div></div>
</div>
<button onclick="location.href=location.pathname" style="position:absolute;top:10px;left:10px;padding:8px 14px;border-radius:8px;border:none;background:#ffeb3b;font-weight:900">← Back</button>
</div>
<script>
const flagMap={"Pakistan":"pk","India":"in","England":"gb-eng","Sri Lanka":"lk","Australia":"au","New Zealand":"nz","South Africa":"za","Bangladesh":"bd","West Indies":"jm","Afghanistan":"af"};
function flagUrl(c){return `https://flagcdn.com/w80/${flagMap[c]||"pk"}.png`;}
const params=new URLSearchParams(location.search);const matchId=params.get('matchId');
if(matchId){
document.getElementById('selector').style.display='none';document.getElementById('overlayMode').style.display='block';
fetchRealScore(matchId);setInterval(()=>fetchRealScore(matchId),5000);
}else{fetchLiveMatches();}
async function fetchLiveMatches(){
const list=document.getElementById('list');
try{
let proxy="https://api.allorigins.win/raw?url=";
let api="https://www.cricbuzz.com/api/cricket/matches/v1/recent";
let r=await fetch(proxy+encodeURIComponent(api));
let j=await r.json();let matches=[];
j.typeMatches.forEach(tm=>{(tm.seriesMatches||[]).forEach(sm=>{if(sm.seriesAdWrapper) matches.push(...sm.seriesAdWrapper.matches);});});
list.innerHTML="";matches.slice(0,25).forEach(m=>{
let id=m.matchInfo.matchId;let t1=m.matchInfo.team1.teamName;let t2=m.matchInfo.team2.teamName;let series=m.matchInfo.seriesName;let status=m.matchInfo.status;
let div=document.createElement('div');div.className='match';
div.innerHTML=`<div><b>${t1} vs ${t2}</b><br><small style="font-size:11px">${series} - ${status}</small></div><span>CLICK →</span>`;
div.onclick=()=>location.href="?matchId="+id;list.appendChild(div);
});
}catch(e){
list.innerHTML=`<div class="match" onclick="location.href='?matchId=89654'"><div><b>Pakistan vs England</b><br><small>PAKISTAN TOUR OF ENGLAND 2025 - DEMO</small></div><span>LIVE</span></div>`;
}
}
async function fetchRealScore(id){
try{
if(id=="89654"){let r=253+Math.floor(Math.random()*6);let o=(43.3+Math.random()).toFixed(1);document.getElementById('t1s').innerText=r+"-5";document.getElementById('t1o').innerText=o;document.getElementById('seriesName').innerText="PAKISTAN TOUR OF ENGLAND 2025 - 3rd ODI";document.getElementById('need').innerText=`NEED ${306-r} RUNS IN 39 BALLS`;return;}
let proxy="https://api.allorigins.win/raw?url=";
let api=`https://www.cricbuzz.com/api/cricket/match/${id}/comm`;
let r=await fetch(proxy+encodeURIComponent(api));let data=await r.json();
let info=data.matchHeader||{};let mini=data.miniscore||{};
document.getElementById('seriesName').innerText=(info.seriesName||"LIVE SERIES")+" - "+(info.matchDescription||"");
document.getElementById('t1n').innerText=mini.batTeam?.teamName||"BAT";document.getElementById('t1s').innerText=mini.batTeamScore||"";document.getElementById('t1o').innerText=mini.overs||"";
document.getElementById('t2n').innerText=mini.bowlTeam?.teamName||"BOWL";document.getElementById('crr').innerText=`CRR: ${mini.currentRunRate||0}`;document.getElementById('need').innerText=mini.status||"LIVE";
document.getElementById('b1n').innerText=mini.batsmanStriker? `${mini.batsmanStriker.batName} ${mini.batsmanStriker.batRuns}(${mini.batsmanStriker.batBalls})`:"";
document.getElementById('b2n').innerText=mini.batsmanNonStriker? `${mini.batsmanNonStriker.batName} ${mini.batsmanNonStriker.batRuns}(${mini.batsmanNonStriker.batBalls})`:"";
}catch(e){console.log(e);}
}
</script>
</body>
</html>
