<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>All Live Matches - Fixed List</title>
<style>
body{margin:0;background:#0a1929;color:#fff;font-family:Arial Black}
#listPage{max-width:700px;margin:auto;padding:15px}
.header{text-align:center;color:#ffeb3b;padding:15px}
.match{background:#fff;color:#000;border-radius:12px;padding:14px;margin:12px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.match:hover{background:#ffeb3b;transform:scale(1.02)}
.badge{padding:5px 12px;border-radius:20px;color:#fff;font-size:11px}
.live{background:#d32f2f} .up{background:#0d47a1}
#overlay{display:none;width:1920px;height:1080px;background:#000;position:relative}
</style>
</head>
<body>
<div id="listPage">
<div class="header">
<h2>🏏 ALL LIVE MATCHES - TRI-SERIES 2026</h2>
<p style="font-family:Arial;font-size:11px" id="status">Connecting to Cricbuzz...</p>
</div>
<div id="matches"></div>
</div>

<div id="overlay">
<h1 style="text-align:center;color:#ffeb3b;padding-top:200px" id="overlayText">Loading...</h1>
<button onclick="location.href=location.pathname" style="position:absolute;top:10px;left:10px;background:#ffeb3b;border:none;padding:10px 16px;border-radius:8px;font-weight:900">← BACK TO LIST</button>
</div>

<script>
const params=new URLSearchParams(location.search);
const mid=params.get('matchId');
if(mid){
 document.getElementById('listPage').style.display='none';
 document.getElementById('overlay').style.display='block';
 document.getElementById('overlayText').innerText='Match ID: '+mid+' - Live Score Loading from Cricbuzz...';
}else{loadListFixed();}

async function loadListFixed(){
 let el=document.getElementById('matches');
 let status=document.getElementById('status');
 
 // STEP 1: فوراً Hardcoded لسٹ دکھا دو تاکہ خالی نہ لگے
 el.innerHTML=`
   <div class="match" onclick="location.href='?matchId=114987'" style="background:#ffeb3b;border:3px solid #d32f2f">
     <div><b>Pakistan vs England - 4th ODI - TODAY 1:00 PM</b><br><small style="font-family:Arial">Gaddafi Stadium, Lahore - Pakistan ODI Tri-Series 2026 - CLICK TO LOAD OVERLAY</small></div>
     <span class="badge live">● LIVE TODAY</span>
   </div>
   <div class="match" onclick="location.href='?matchId=114985'">
     <div><b>Pakistan vs Sri Lanka - 1st ODI</b><br><small style="font-family:Arial">Rawalpindi - Tri-Series 2026</small></div>
     <span class="badge up">RECENT</span>
   </div>
   <div class="match" onclick="location.href='?matchId=114986'">
     <div><b>Sri Lanka vs England - 3rd ODI</b><br><small style="font-family:Arial">Rawalpindi - 429/4 vs 430/8 - SL Won</small></div>
     <span class="badge up">RESULT</span>
   </div>
   <div class="match" onclick="location.href='?matchId=89654'">
     <div><b>Sri Lanka vs Pakistan - Your Screenshot Design</b><br><small style="font-family:Arial">253-5 (43.3) - Demo Overlay</small></div>
     <span class="badge live">DEMO</span>
   </div>
 `;
 status.innerText='Showing Tri-Series Matches (Hardcoded) - Now trying to fetch live from Cricbuzz...';

 // STEP 2: اب Cricbuzz سے Real List لانے کی کوشش کرو - اگر آ گئی تو اس لسٹ کو Replace کر دو
 let proxies=[
   "https://corsproxy.io/?",
   "https://api.allorigins.win/raw?url=",
   "https://api.codetabs.com/v1/proxy?quest=",
   "https://thingproxy.freeboard.name/fetch/"
 ];
 
 for(let proxy of proxies){
  try{
   status.innerText='Trying Proxy: '+proxy+' ...';
   let r=await fetch(proxy+encodeURIComponent("https://www.cricbuzz.com/api/cricket/matches/v1/recent"),{cache:'no-store'});
   if(!r.ok) continue;
   let j=await r.json();
   let arr=[];
   j.typeMatches.forEach(tm=>tm.seriesMatches.forEach(sm=>{if(sm.seriesAdWrapper)arr.push(...sm.seriesAdWrapper.matches)}));
   if(arr.length>0){
     status.innerText='Live from Cricbuzz - '+arr.length+' Matches Found!';
     el.innerHTML=''; // Hardcoded ہٹا دو
     arr.slice(0,20).forEach(m=>{
       let id=m.matchInfo.matchId;let t1=m.matchInfo.team1.teamName;let t2=m.matchInfo.team2.teamName;
       let d=document.createElement('div');d.className='match';
       let isLive=m.matchInfo.state=='In Progress';
       d.innerHTML=`<div><b>${t1} vs ${t2}</b><br><small style="font-family:Arial">${m.matchInfo.seriesName} - ${m.matchInfo.status}</small></div><span class="badge ${isLive?'live':'up'}">${isLive?'● LIVE':'VIEW'}</span>`;
       d.onclick=()=>location.href='?matchId='+id;
       el.appendChild(d);
     });
     return;
   }
  }catch(e){ console.log(e); }
 }
 status.innerText='Cricbuzz API Blocked on GitHub - Showing Hardcoded Tri-Series List (Click any)';
}
</script>
</body>
</html>
