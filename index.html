<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizwan AI Cricket Studio</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 15px;
}
section {
  background: #1d2b43;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
}
input, button {
  padding: 10px;
  margin: 5px 0;
  max-width: 100%;
}
button {
  background: #10b981;
  color: white;
  border: 0;
  border-radius: 5px;
}
iframe {
  width: 100%;
  height: 250px;
  background: white;
}
video, img {
  max-width: 100%;
}
</style>
</head>
<body>

<h1>🏏 Rizwan AI Cricket Studio</h1>

<section>
<h2>تین ویب سائٹس</h2>
<input id="url1" placeholder="Website 1 URL">
<button onclick="openSite(1)">Open Website 1</button>
<iframe id="site1"></iframe>

<input id="url2" placeholder="Website 2 URL">
<button onclick="openSite(2)">Open Website 2</button>
<iframe id="site2"></iframe>

<input id="url3" placeholder="Website 3 URL">
<button onclick="openSite(3)">Open Website 3</button>
<iframe id="site3"></iframe>
</section>

<section>
<h2>اپنی ویڈیو اپلوڈ کریں</h2>
<input type="file" id="videoFile" accept="video/*">
<label>
<input type="checkbox" id="loop" checked> مسلسل لوپ
</label>
<br>
<video id="video" controls loop muted></video>
</section>

<section>
<h2>تصویر کا بیک گراؤنڈ ریموو</h2>
<input type="file" id="imageFile" accept="image/*">
<br>
<button onclick="removeBackground()">سفید رنگ شفاف کریں</button>
<br>
<canvas id="canvas"></canvas>
<button onclick="downloadPNG()">PNG ڈاؤن لوڈ کریں</button>
</section>

<script>
function openSite(n) {
  let input = document.getElementById("url" + n);
  let url = input.value.trim();

  if (!url) {
    alert("Website URL لکھیں");
    return;
  }

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  document.getElementById("site" + n).src = url;
}

document.getElementById("videoFile").onchange = function() {
  let file = this.files[0];
  if (!file) return;

  let video = document.getElementById("video");
  video.src = URL.createObjectURL(file);
  video.loop = document.getElementById("loop").checked;
  video.play().catch(() => {});
};

document.getElementById("loop").onchange = function() {
  document.getElementById("video").loop = this.checked;
};

function removeBackground() {
  let file = document.getElementById("imageFile").files[0];
  if (!file) {
    alert("پہلے تصویر اپلوڈ کریں");
    return;
  }

  let img = new Image();
  img.onload = function() {
    let canvas = document.getElementById("canvas");
    let ctx = canvas.getContext("2d");
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    let data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let pixels = data.data;

    for (let i = 0; i < pixels.length; i += 4) {
      if (pixels[i] > 235 &&
          pixels[i + 1] > 235 &&
          pixels[i + 2] > 235) {
        pixels[i + 3] = 0;
      }
    }

    ctx.putImageData(data, 0, 0);
  };

  img.src = URL.createObjectURL(file);
}

function downloadPNG() {
  let canvas = document.getElementById("canvas");
  if (!canvas.width) {
    alert("پہلے تصویر کا بیک گراؤنڈ ریموو کریں");
    return;
  }

  let a = document.createElement("a");
  a.download = "rizwan-transparent.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
}
</script>

</body>
</html>
